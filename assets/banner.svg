<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Sridhar VPR — Circuits meet code</title>
  <desc id="desc">Cinematic dark technology banner with animated neon gradients, circuit paths, particles, and an ECE plus web development title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03040b"/>
      <stop offset=".45" stop-color="#100a25"/>
      <stop offset="1" stop-color="#031923"/>
      <animate attributeName="x1" values="0;1;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="violet">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".46"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".34"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a5b4fc" stroke-opacity=".085" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="930" cy="90" r="250" fill="url(#violet)" filter="url(#blur)">
      <animate attributeName="cx" values="900;1020;900" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;145;80" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="335" r="230" fill="url(#cyan)" filter="url(#blur)">
      <animate attributeName="cx" values="1080;960;1080" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- subtle moving scan line -->
    <rect x="0" y="-8" width="1200" height="3" fill="url(#neon)" opacity=".35">
      <animate attributeName="y" values="-8;428;-8" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- circuit paths -->
    <g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".72" filter="url(#glow)">
      <path d="M710 0V54H790V94H862V128H928">
        <animate attributeName="stroke-dasharray" values="0 500;500 0" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M830 0V28H918V68H1050V110H1200" stroke-dasharray="8 9">
        <animate attributeName="stroke-dashoffset" values="0;-68" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M1200 170H1110V205H1042V245H980V284H900"/>
      <path d="M1200 328H1100V294H1060V260H1010" stroke-dasharray="6 8">
        <animate attributeName="stroke-dashoffset" values="0;56" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M760 420V360H816V320H870V282H914"/>
      <path d="M1155 0V42H1110V82H1070"/>
      <path d="M720 240H790V220H845V190H890"/>
    </g>

    <!-- pulsing nodes -->
    <g fill="#67e8f9">
      <circle cx="928" cy="128" r="4"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="1200" cy="110" r="4"><animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="282" r="4"><animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="360" r="4"><animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="1070" cy="82" r="4"><animate attributeName="r" values="3;6;3" dur="2.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- floating data particles -->
    <g fill="#c4b5fd">
      <circle cx="710" cy="150" r="2"><animate attributeName="cy" values="150;118;150" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="920" cy="355" r="2"><animate attributeName="cy" values="355;326;355" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="145" r="2"><animate attributeName="cx" values="1140;1100;1140" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="80" r="2"><animate attributeName="cy" values="80;104;80" dur="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- title panel -->
    <rect x="58" y="60" width="650" height="300" rx="22" fill="#070914" fill-opacity=".58" stroke="#c4b5fd" stroke-opacity=".18"/>
    <rect x="58" y="60" width="5" height="300" rx="2.5" fill="url(#neon)"/>
    <text x="91" y="126" fill="#a5b4fc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="5">ENGINEERING × CREATIVE TECHNOLOGY</text>
    <text x="88" y="191" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1.2">SRIDHAR VPR</text>
    <text x="91" y="237" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="650">ELECTRONICS &amp; COMMUNICATION</text>
    <text x="91" y="270" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="650">ENGINEERING  ×  WEB DEVELOPMENT</text>
    <text x="91" y="315" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="16">Circuits. Code. Curiosity. Continuous improvement.</text>

    <!-- chip / code emblem -->
    <g transform="translate(1000 205)" fill="none" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)">
      <rect x="-48" y="-48" width="96" height="96" rx="20" opacity=".95"/>
      <rect x="-31" y="-31" width="62" height="62" rx="12" opacity=".6"/>
      <path d="M-67 -20H-48M-67 0H-48M-67 20H-48M48 -20H67M48 0H67M48 20H67M-20 -67V-48M0 -67V-48M20 -67V-48M-20 48V67M0 48V67M20 48V67"/>
      <path d="M-18 -12L-4 0L-18 12M4 12H20" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <animateTransform attributeName="transform" type="rotate" values="0 1000 205;2 1000 205;0 1000 205;-2 1000 205;0 1000 205" dur="8s" repeatCount="indefinite" additive="sum"/>
    </g>

    <text x="1140" y="392" text-anchor="end" fill="#94a3b8" font-family="Consolas, monospace" font-size="12" letter-spacing="2">ECE // WEB // BUILD</text>
    <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="url(#neon)" stroke-opacity=".55" stroke-width="2"/>
  </g>
</svg>
