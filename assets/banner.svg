<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sridhar VPR — Electronics and Web Development</title>
  <desc id="desc">A dark cinematic banner with cyan circuit traces, purple gradients, and a title about electronics and web development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070912"/>
      <stop offset="0.55" stop-color="#11102a"/>
      <stop offset="1" stop-color="#071a24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="970" cy="70" r="145" fill="#7c3aed" opacity=".24" filter="url(#blur)"/>
  <circle cx="1060" cy="290" r="135" fill="#06b6d4" opacity=".18" filter="url(#blur)"/>
  <g fill="none" stroke="url(#glow)" stroke-width="2" opacity=".7">
    <path d="M730 0V60H790V95H860V135H920"/>
    <path d="M820 0V30H900V60H1030V100H1200"/>
    <path d="M1200 165H1120V195H1050V235H980V270H900"/>
    <path d="M1200 310H1100V280H1060V250"/>
    <path d="M750 360V320H810V280H860V245H915"/>
    <path d="M1150 0V35H1100V75H1065"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="920" cy="135" r="4"/><circle cx="1200" cy="100" r="4"/>
    <circle cx="900" cy="245" r="4"/><circle cx="750" cy="320" r="4"/>
    <circle cx="1065" cy="75" r="4"/><circle cx="980" cy="270" r="4"/>
  </g>
  <g transform="translate(74 70)">
