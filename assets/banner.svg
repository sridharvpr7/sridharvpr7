    <text x="30" y="105" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">ELECTRONICS &amp; COMMUNICATION</text>
    <text x="30" y="137" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">ENGINEERING  ×  WEB DEVELOPMENT</text>
    <text x="30" y="174" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="16">Circuits • Code • Creative problem solving</text>
  </g>
  <g transform="translate(1000 175)" fill="none" stroke="#a78bfa" stroke-width="2">
    <rect x="-42" y="-42" width="84" height="84" rx="18" opacity=".85"/>
