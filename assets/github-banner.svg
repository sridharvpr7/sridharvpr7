<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">SRIDHAR VPR - ECE Student | Web Developer</title>
  <desc id="d">Circuit-board themed banner with a microchip emblem, cyan and violet glow, on a dark background.</desc>
  <defs>
    <style>
    .sig{stroke-dasharray:14 190;animation:flow 6s linear infinite}
    .sig.b{animation-duration:8s;animation-delay:-3s}
    .sig.c{animation-duration:10s;animation-delay:-5s}
    .scan{animation:scan 9s linear infinite}
    .pulse{animation:pulse 3.2s ease-in-out infinite}
    .pulse.b{animation-delay:-1.1s}.pulse.c{animation-delay:-2.1s}
    @keyframes flow{from{stroke-dashoffset:204}to{stroke-dashoffset:0}}
    @keyframes scan{from{transform:translateX(-160px)}to{transform:translateX(1260px)}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.sig,.scan,.pulse{animation:none}}
  </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d14"/><stop offset=".6" stop-color="#0f1220"/><stop offset="1" stop-color="#1a1233"/></linearGradient>
    <radialGradient id="glowC" cx="0.82" cy="0.5" r="0.45"><stop offset="0" stop-color="#00e5ff" stop-opacity=".22"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowV" cx="0.1" cy="1" r="0.55"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".25"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9eeeff"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff" stop-opacity=".16"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="300" rx="14"/></clipPath>
  </defs>
